services:
  sbom-convert:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbom-converter:local
    init: true
    working_dir: /data
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output
    environment:
      NVD_API_KEY: ${NVD_API_KEY:-}
    # Dockerfile remains non-root by default. run-sbom.sh supplies the
    # host UID/GID so generated reports are owned by the invoking user.
    entrypoint: ["sbom-convert"]
